<rect width="1400" height="960" fill="#09090b"/>
<text x="40" y="60" fill="#fafafa" font-size="30" font-weight="700">Write path</text>
<text x="40" y="94" fill="#a1a1aa" font-size="20">The graph is written from the same model response as the translation. No extra call.</text>
