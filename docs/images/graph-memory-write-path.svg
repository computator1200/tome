<path d="M674,205 C700,205 700,266 730,266" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrA)"/>
<rect x="734" y="244" width="220" height="46" rx="10" fill="#18181b" stroke="#38bdf8" stroke-width="2"/>
<text x="844.0" y="274.0" text-anchor="middle" fill="#38bdf8" font-size="18" font-family="Consolas, 'Cascadia Mono', ui-monospace, monospace">memory</text>
<path d="M844,290 V330" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrA)"/>
<text x="870" y="316" fill="#a1a1aa" font-size="16" font-weight="400" text-anchor="start">its own session: a failure rolls back itself, never the page</text>
<text x="40" y="362" fill="#fafafa" font-size="18" font-weight="700" text-anchor="start">ENTITIES</text>
<text x="140" y="362" fill="#a1a1aa" font-size="16" font-weight="400" text-anchor="start">up to 40 per response; aliases the model lists attach directly; pronouns are skipped</text>
<rect x="40" y="380" width="220" height="110" rx="10" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
<text x="150.0" y="414.0" text-anchor="middle" fill="#fafafa" font-size="21" font-weight="600">norm()</text>
<text x="150.0" y="442.0" text-anchor="middle" fill="#a1a1aa" font-size="17">NFKC, casefold,</text>
<text x="150.0" y="470.0" text-anchor="middle" fill="#a1a1aa" font-size="17">strip honorifics</text>
<path d="M260,435 H296" fill="none" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="300" y="380" width="220" height="110" rx="10" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
<text x="410.0" y="414.0" text-anchor="middle" fill="#fafafa" font-size="21" font-weight="600">Exact alias</text>
<text x="410.0" y="442.0" text-anchor="middle" fill="#a1a1aa" font-size="17">indexed lookup</text>
<text x="410.0" y="470.0" text-anchor="middle" fill="#a1a1aa" font-size="17">on norm</text>
<path d="M520,435 H556" fill="none" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="540" y="422" fill="#a1a1aa" font-size="16" text-anchor="middle">miss</text>
<rect x="560" y="380" width="220" height="110" rx="10" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
<text x="670.0" y="414.0" text-anchor="middle" fill="#fafafa" font-size="21" font-weight="600">Fuzzy match</text>
<text x="670.0" y="442.0" text-anchor="middle" fill="#a1a1aa" font-size="17">ratio 0.90, same</text>
<text x="670.0" y="470.0" text-anchor="middle" fill="#a1a1aa" font-size="17">kind and script</text>
<path d="M780,435 H816" fill="none" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="800" y="422" fill="#a1a1aa" font-size="16" text-anchor="middle">miss</text>
<rect x="820" y="380" width="220" height="110" rx="10" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
<text x="930.0" y="414.0" text-anchor="middle" fill="#fafafa" font-size="21" font-weight="600">Short form</text>
<text x="930.0" y="442.0" text-anchor="middle" fill="#a1a1aa" font-size="17">people only, and</text>
<text x="930.0" y="470.0" text-anchor="middle" fill="#a1a1aa" font-size="17">only if one fits</text>
<path d="M1040,435 H1076" fill="none" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="1060" y="422" fill="#a1a1aa" font-size="16" text-anchor="middle">miss</text>
<rect x="1080" y="380" width="280" height="110" rx="10" fill="#18181b" stroke="#38bdf8" stroke-width="2"/>
<text x="1220.0" y="428.0" text-anchor="middle" fill="#fafafa" font-size="21" font-weight="600">New entity</text>
<text x="1220.0" y="456.0" text-anchor="middle" fill="#a1a1aa" font-size="17">first seen at (N, p)</text>
<path d="M410,490 V536" fill="none" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="425" y="520" fill="#a1a1aa" font-size="16" text-anchor="start">hit</text>
<path d="M670,490 V536" fill="none" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="685" y="520" fill="#a1a1aa" font-size="16" text-anchor="start">hit</text>
<path d="M930,490 V536" fill="none" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="945" y="520" fill="#a1a1aa" font-size="16" text-anchor="start">hit</text>
<path d="M1220,490 V536" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrA)"/>
<rect x="300" y="540" width="1060" height="60" rx="10" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
<text x="830.0" y="577.0" text-anchor="middle" fill="#a1a1aa" font-size="17">Attach the surface form as an alias if its norm is new; move its first sighting to (N, p) if earlier</text>
<text x="40" y="652" fill="#fafafa" font-size="18" font-weight="700" text-anchor="start">RELATIONS</text>
<text x="160" y="652" fill="#a1a1aa" font-size="16" font-weight="400" text-anchor="start">up to 40 per response</text>
<rect x="40" y="670" width="220" height="110" rx="10" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
<text x="150.0" y="704.0" text-anchor="middle" fill="#fafafa" font-size="21" font-weight="600">clean_relation()</text>
<text x="150.0" y="732.0" text-anchor="middle" fill="#a1a1aa" font-size="17">snake_case, fold</text>
<text x="150.0" y="760.0" text-anchor="middle" fill="#a1a1aa" font-size="17">known synonyms</text>
<path d="M260,725 H296" fill="none" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="300" y="670" width="220" height="110" rx="10" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
<text x="410.0" y="704.0" text-anchor="middle" fill="#fafafa" font-size="21" font-weight="600">Resolve ends</text>
<text x="410.0" y="732.0" text-anchor="middle" fill="#a1a1aa" font-size="17">this page's names</text>
<text x="410.0" y="760.0" text-anchor="middle" fill="#a1a1aa" font-size="17">first, then the chain</text>
<path d="M520,725 H556" fill="none" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="560" y="670" width="220" height="110" rx="10" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
<text x="670.0" y="704.0" text-anchor="middle" fill="#fafafa" font-size="21" font-weight="600">relation_allowed()</text>
<text x="670.0" y="732.0" text-anchor="middle" fill="#a1a1aa" font-size="17">unknown verb or</text>
<text x="670.0" y="760.0" text-anchor="middle" fill="#a1a1aa" font-size="17">wrong kinds: dropped</text>
<path d="M780,725 H816" fill="none" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="800" y="712" fill="#a1a1aa" font-size="16" text-anchor="middle">ok</text>
<rect x="820" y="670" width="220" height="110" rx="10" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
<text x="930.0" y="704.0" text-anchor="middle" fill="#fafafa" font-size="21" font-weight="600">Already stored?</text>
<text x="930.0" y="732.0" text-anchor="middle" fill="#a1a1aa" font-size="17">keep the earliest</text>
<text x="930.0" y="760.0" text-anchor="middle" fill="#a1a1aa" font-size="17">position</text>
<path d="M1040,725 H1076" fill="none" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="1060" y="712" fill="#a1a1aa" font-size="16" text-anchor="middle">no</text>
<rect x="1080" y="670" width="280" height="110" rx="10" fill="#18181b" stroke="#38bdf8" stroke-width="2"/>
<text x="1220.0" y="718.0" text-anchor="middle" fill="#fafafa" font-size="21" font-weight="600">New edge</text>
<text x="1220.0" y="746.0" text-anchor="middle" fill="#a1a1aa" font-size="17">established at (N, p)</text>
<path d="M1220,780 V830" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrA)"/>
<rect x="560" y="834" width="800" height="80" rx="10" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
<text x="960.0" y="867.0" text-anchor="middle" fill="#d4d4d8" font-size="18" font-family="Consolas, 'Cascadia Mono', ui-monospace, monospace">memory_entities   memory_aliases   memory_edges</text>
<text x="960.0" y="895.0" text-anchor="middle" fill="#a1a1aa" font-size="17">committed after the page; a re-run never deletes anything</text>
<text x="40" y="866" fill="#fafafa" font-size="18" font-weight="600" text-anchor="start">A re-run resolves to the same rows:</text>
<text x="40" y="894" fill="#a1a1aa" font-size="18" font-weight="400" text-anchor="start">existing aliases hit, duplicate edges are skipped.</text>
</svg>