<rect x="344" y="140" width="330" height="130" rx="10" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
<text x="509.0" y="184.0" text-anchor="middle" fill="#fafafa" font-size="21" font-weight="600">One model call</text>
<text x="509.0" y="212.0" text-anchor="middle" fill="#d4d4d8" font-size="18" font-family="Consolas, 'Cascadia Mono', ui-monospace, monospace">translate_text()</text>
<text x="509.0" y="240.0" text-anchor="middle" fill="#d4d4d8" font-size="18" font-family="Consolas, 'Cascadia Mono', ui-monospace, monospace">vision_ocr_translate()</text>
