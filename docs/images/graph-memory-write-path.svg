<text x="160.0" y="198.0" text-anchor="middle" fill="#fafafa" font-size="21" font-weight="600">Page or batch</text>
<text x="160.0" y="226.0" text-anchor="middle" fill="#a1a1aa" font-size="17">volume N, page p</text>
