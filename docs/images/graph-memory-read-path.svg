<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1a1aa"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker></defs>
<rect width="1400" height="1000" fill="#09090b"/>
<text x="40" y="60" fill="#fafafa" font-size="30" font-weight="700">Read path</text>
<text x="40" y="94" fill="#a1a1aa" font-size="20">What a reader at volume N may know. Two SQL queries, no model call.</text>
<text x="40" y="150" fill="#fafafa" font-size="18" font-weight="700" text-anchor="start">A SERIES OF 12 VOLUMES, READER AT VOLUME 3</text>
<rect x="60" y="170" width="302" height="44" rx="8" fill="#0c1a24" stroke="#38bdf8" stroke-width="1.5"/>
<line x1="80" y1="192" x2="1235" y2="192" stroke="#3f3f46" stroke-width="2"/>
<circle cx="80" cy="192" r="6" fill="#38bdf8"/>
<text x="80" y="242" fill="#38bdf8" font-size="16" font-weight="400" text-anchor="middle">vol 1</text>
<circle cx="185" cy="192" r="6" fill="#38bdf8"/>
<text x="185" y="242" fill="#38bdf8" font-size="16" font-weight="400" text-anchor="middle">vol 2</text>
<circle cx="290" cy="192" r="9" fill="#38bdf8"/>
<text x="290" y="242" fill="#38bdf8" font-size="16" font-weight="600" text-anchor="middle">vol 3</text>
<circle cx="395" cy="192" r="6" fill="#52525b"/>
<text x="395" y="242" fill="#71717a" font-size="16" font-weight="400" text-anchor="middle">vol 4</text>
<circle cx="500" cy="192" r="6" fill="#52525b"/>
<text x="500" y="242" fill="#71717a" font-size="16" font-weight="400" text-anchor="middle">vol 5</text>
<circle cx="605" cy="192" r="6" fill="#52525b"/>
<text x="605" y="242" fill="#71717a" font-size="16" font-weight="400" text-anchor="middle">vol 6</text>
<circle cx="710" cy="192" r="6" fill="#52525b"/>
<text x="710" y="242" fill="#71717a" font-size="16" font-weight="400" text-anchor="middle">vol 7</text>
<circle cx="815" cy="192" r="6" fill="#52525b"/>
<text x="815" y="242" fill="#71717a" font-size="16" font-weight="400" text-anchor="middle">vol 8</text>
<circle cx="920" cy="192" r="6" fill="#52525b"/>
<text x="920" y="242" fill="#71717a" font-size="16" font-weight="400" text-anchor="middle">vol 9</text>
<circle cx="1025" cy="192" r="6" fill="#52525b"/>
<text x="1025" y="242" fill="#71717a" font-size="16" font-weight="400" text-anchor="middle">vol 10</text>
<circle cx="1130" cy="192" r="6" fill="#52525b"/>
<text x="1130" y="242" fill="#71717a" font-size="16" font-weight="400" text-anchor="middle">vol 11</text>
<circle cx="1235" cy="192" r="6" fill="#52525b"/>
<text x="1235" y="242" fill="#71717a" font-size="16" font-weight="400" text-anchor="middle">vol 12</text>
<text x="60" y="300" fill="#38bdf8" font-size="18" font-weight="600" text-anchor="start">vol 1</text>
<text x="150" y="300" fill="#fafafa" font-size="19" font-weight="400" text-anchor="start">館脇正太郎 knows 九条櫻子</text>
<text x="520" y="300" fill="#a1a1aa" font-size="17" font-weight="400" text-anchor="start">in the volume 3 view</text>
<text x="60" y="340" fill="#38bdf8" font-size="18" font-weight="600" text-anchor="start">vol 2</text>
<text x="150" y="340" fill="#fafafa" font-size="19" font-weight="400" text-anchor="start">リゼット serves 灰の教団</text>
<text x="520" y="340" fill="#a1a1aa" font-size="17" font-weight="400" text-anchor="start">in the volume 3 view</text>
<text x="60" y="380" fill="#71717a" font-size="18" font-weight="600" text-anchor="start">vol 12</text>
<text x="150" y="380" fill="#71717a" font-size="19" font-weight="400" text-anchor="start">リゼット betrays 灰の教団</text>
<text x="520" y="380" fill="#a1a1aa" font-size="17" font-weight="400" text-anchor="start">established in volume 12: not in the view, not in the prompt</text>
<rect x="40" y="470" width="300" height="150" rx="10" fill="#18181b" stroke="#38bdf8" stroke-width="2"/>
<text x="190.0" y="510.0" text-anchor="middle" fill="#fafafa" font-size="21" font-weight="600">Reader at volume N</text>
<text x="190.0" y="538.0" text-anchor="middle" fill="#a1a1aa" font-size="17">start of a volume run, or</text>
<text x="190.0" y="566.0" text-anchor="middle" fill="#d4d4d8" font-size="18" font-family="Consolas, 'Cascadia Mono', ui-monospace, monospace">GET /api/series/{id}</text>
<text x="190.0" y="594.0" text-anchor="middle" fill="#d4d4d8" font-size="18" font-family="Consolas, 'Cascadia Mono', ui-monospace, monospace">/memory?volume=N</text>
<path d="M340,545 H392" fill="none" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="396" y="460" width="560" height="170" rx="10" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
<text x="676" y="494" fill="#fafafa" font-size="21" font-weight="600" text-anchor="middle">build_context(series_id, N)</text>
<text x="420" y="530" fill="#d4d4d8" font-size="16" font-weight="400" text-anchor="start" font-family="Consolas, 'Cascadia Mono', ui-monospace, monospace">memory_entities WHERE <tspan fill="#38bdf8">first_volume &lt;= N</tspan></text>
<text x="420" y="552" fill="#a1a1aa" font-size="16" font-weight="400" text-anchor="start" font-family="Consolas, 'Cascadia Mono', ui-monospace, monospace">ORDER BY first_volume, canonical LIMIT <tspan fill="#38bdf8">80</tspan></text>
<text x="420" y="580" fill="#d4d4d8" font-size="16" font-weight="400" text-anchor="start" font-family="Consolas, 'Cascadia Mono', ui-monospace, monospace">memory_edges WHERE <tspan fill="#38bdf8">established_volume &lt;= N</tspan></text>
<text x="420" y="602" fill="#a1a1aa" font-size="16" font-weight="400" text-anchor="start" font-family="Consolas, 'Cascadia Mono', ui-monospace, monospace">ORDER BY established_volume LIMIT <tspan fill="#38bdf8">60</tspan></text>
<path d="M956,510 C990,510 990,480 1020,480" fill="none" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="1024" y="440" width="336" height="200" rx="10" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
<text x="1192.0" y="477.0" text-anchor="middle" fill="#d4d4d8" font-size="18" font-family="Consolas, 'Cascadia Mono', ui-monospace, monospace">{</text>
<text x="1192.0" y="505.0" text-anchor="middle" fill="#d4d4d8" font-size="18" font-family="Consolas, 'Cascadia Mono', ui-monospace, monospace">  stats,</text>
<text x="1192.0" y="533.0" text-anchor="middle" fill="#d4d4d8" font-size="18" font-family="Consolas, 'Cascadia Mono', ui-monospace, monospace">  scoped_to_volume,</text>
<text x="1192.0" y="561.0" text-anchor="middle" fill="#d4d4d8" font-size="18" font-family="Consolas, 'Cascadia Mono', ui-monospace, monospace">  entities, edges,</text>
<text x="1192.0" y="589.0" text-anchor="middle" fill="#d4d4d8" font-size="18" font-family="Consolas, 'Cascadia Mono', ui-monospace, monospace">  truncated: {entities, edges}</text>
<text x="1192.0" y="617.0" text-anchor="middle" fill="#d4d4d8" font-size="18" font-family="Consolas, 'Cascadia Mono', ui-monospace, monospace">}</text>
<text x="1192" y="430" fill="#a1a1aa" font-size="17" font-weight="600" text-anchor="middle">API response</text>
<text x="1024" y="668" fill="#a1a1aa" font-size="16" font-weight="400" text-anchor="start">truncated = fewer rows returned than the</text>
<text x="1024" y="692" fill="#a1a1aa" font-size="16" font-weight="400" text-anchor="start">series holds in total (cap or scope)</text>
<text x="1024" y="716" fill="#a1a1aa" font-size="16" font-weight="400" text-anchor="start">stats() counts the whole series, unscoped</text>
<path d="M676,630 V690" fill="none" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="396" y="694" width="560" height="70" rx="10" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
<text x="676.0" y="722.0" text-anchor="middle" fill="#d4d4d8" font-size="18" font-family="Consolas, 'Cascadia Mono', ui-monospace, monospace">render_context()</text>
<text x="676.0" y="750.0" text-anchor="middle" fill="#a1a1aa" font-size="17">24 names per kind, 40 relations</text>
<path d="M676,764 V808" fill="none" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="40" y="812" width="916" height="168" rx="10" fill="#0c1a24" stroke="#38bdf8" stroke-width="1.5"/>
<text x="64" y="842" fill="#e4e4e7" font-size="17" font-weight="400" text-anchor="start" font-family="Consolas, 'Cascadia Mono', ui-monospace, monospace">What is known by volume 3 (do not reveal anything beyond it):</text>
<text x="64" y="867" fill="#e4e4e7" font-size="17" font-weight="400" text-anchor="start" font-family="Consolas, 'Cascadia Mono', ui-monospace, monospace">- persons: 九条櫻子, 館脇正太郎, リゼット</text>
<text x="64" y="892" fill="#e4e4e7" font-size="17" font-weight="400" text-anchor="start" font-family="Consolas, 'Cascadia Mono', ui-monospace, monospace">- orgs: 九条家, 灰の教団</text>
<text x="64" y="917" fill="#e4e4e7" font-size="17" font-weight="400" text-anchor="start" font-family="Consolas, 'Cascadia Mono', ui-monospace, monospace">Relations:</text>
<text x="64" y="942" fill="#e4e4e7" font-size="17" font-weight="400" text-anchor="start" font-family="Consolas, 'Cascadia Mono', ui-monospace, monospace">- 館脇正太郎 knows 九条櫻子 (vol 1)</text>
<text x="64" y="967" fill="#e4e4e7" font-size="17" font-weight="400" text-anchor="start" font-family="Consolas, 'Cascadia Mono', ui-monospace, monospace">- リゼット serves 灰の教団 (vol 2)</text>
<text x="1024" y="860" fill="#fafafa" font-size="20" font-weight="700" text-anchor="start">Prompt block</text>
<text x="1024" y="890" fill="#a1a1aa" font-size="17" font-weight="400" text-anchor="start">placed before the glossary by</text>
<text x="1024" y="914" fill="#a1a1aa" font-size="17" font-weight="400" text-anchor="start">llm._context_block(), built once</text>
<text x="1024" y="938" fill="#a1a1aa" font-size="17" font-weight="400" text-anchor="start">per volume run</text>
</svg>