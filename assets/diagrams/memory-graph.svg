<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a1a1aa"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="1400" height="640" fill="#09090b"/>
  <text x="40" y="62" fill="#fafafa" font-size="30" font-weight="700">Series memory</text>
  <text x="40" y="96" fill="#a1a1aa" font-size="18">Entities, their aliases, and edges that unlock by volume.</text>

  <!-- aliases -->
  <text x="60" y="262" fill="#a1a1aa" font-size="15">aliases</text>
  <rect x="60" y="278" width="150" height="44" rx="22" fill="#0c1a24" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="135" y="307" fill="#fafafa" font-size="18" text-anchor="middle">リゼット</text>
  <rect x="60" y="378" width="150" height="44" rx="22" fill="#0c1a24" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="135" y="407" fill="#fafafa" font-size="18" text-anchor="middle">Lizette</text>
  <g stroke="#38bdf8" stroke-width="1.5" fill="none" marker-end="url(#arrA)">
    <path d="M210,300 C320,300 330,330 416,334"/>
    <path d="M210,400 C320,400 330,346 416,344"/>
  </g>

  <!-- edges -->
  <g stroke="#a1a1aa" stroke-width="2" fill="none" marker-end="url(#arr)">
    <path d="M620,338 H860 V232"/>
    <path d="M520,376 V464"/>
    <path d="M920,226 V464"/>
  </g>
  <g font-size="16">
    <rect x="668" y="323" width="140" height="30" rx="15" fill="#09090b"/>
    <text x="738" y="344" fill="#fafafa" text-anchor="middle">serves · vol 2</text>
    <rect x="534" y="405" width="140" height="30" rx="15" fill="#09090b"/>
    <text x="540" y="426" fill="#fafafa">born in · vol 1</text>
    <rect x="740" y="405" width="170" height="30" rx="15" fill="#09090b"/>
    <text x="906" y="426" fill="#fafafa" text-anchor="end">member of · vol 12</text>
  </g>

  <!-- entities -->
  <g fill="#18181b" stroke="#52525b" stroke-width="2">
    <rect x="420" y="300" width="200" height="76" rx="14" stroke="#38bdf8"/>
    <rect x="760" y="150" width="200" height="76" rx="14"/>
    <rect x="420" y="470" width="200" height="76" rx="14"/>
    <rect x="760" y="470" width="200" height="76" rx="14"/>
    <rect x="420" y="150" width="200" height="76" rx="14"/>
  </g>
  <g fill="#a1a1aa" font-size="15" font-weight="600" letter-spacing="1.5" text-anchor="middle">
    <text x="520" y="327">PERSON</text>
    <text x="860" y="177">PERSON</text>
    <text x="520" y="497">PLACE</text>
    <text x="860" y="497">ORGANISATION</text>
    <text x="520" y="177">TERM</text>
  </g>
  <g fill="#fafafa" font-size="22" font-weight="600" text-anchor="middle">
    <text x="520" y="359">Lizette</text>
    <text x="860" y="209">Captain Varro</text>
    <text x="520" y="529">Port Seren</text>
    <text x="860" y="529">Order of Ash</text>
    <text x="520" y="209">mana</text>
  </g>

  <!-- callout -->
  <rect x="1030" y="150" width="330" height="396" rx="16" fill="#111114" stroke="#3f3f46" stroke-width="2"/>
  <text x="1060" y="196" fill="#fafafa" font-size="22" font-weight="700">Translating volume 3</text>
  <text x="1060" y="226" fill="#a1a1aa" font-size="16">Edges sent with the prompt:</text>

  <g font-size="18">
    <text x="1060" y="280" fill="#22c55e" font-weight="700">✓</text>
    <text x="1088" y="280" fill="#fafafa">born in · vol 1</text>
    <text x="1060" y="326" fill="#22c55e" font-weight="700">✓</text>
    <text x="1088" y="326" fill="#fafafa">serves · vol 2</text>
    <text x="1060" y="372" fill="#71717a" font-weight="700">✕</text>
    <text x="1088" y="372" fill="#71717a">member of · vol 12</text>
  </g>
  <line x1="1086" y1="366" x2="1238" y2="366" stroke="#71717a" stroke-width="2"/>
  <text x="1088" y="400" fill="#f59e0b" font-size="16">hidden until vol 12</text>
  <text x="1060" y="456" fill="#a1a1aa" font-size="16">No spoilers from later volumes.</text>
</svg>
